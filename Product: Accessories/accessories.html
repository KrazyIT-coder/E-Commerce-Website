<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí Products</title>
  <link rel="stylesheet" href="accessorries.css">
</head>
<body>

  <div class="products">

    <div class="card" data-photos="IMAGES/SSTB1.jpg, IMAGES/SSTB2.jpg, IMAGES/SSTB3.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#d4b772" data-card-color="#EDE6D6" aria-label="Cream"></button>
        </div>
        <p class="name">Solihiya Structured Tote Bag</p>
        <p class="price">₱790</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/SRBH.jpg, IMAGES/SRBH2.jpg, IMAGES/SRBH3.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:linear-gradient(135deg,#C9A57A 33%,#5A3E2B 33% 66%,#2F3E66 66%)" data-card-color="#D8D4CF" aria-label="Tan and navy woven"></button>
          <button class="color" type="button" style="background:linear-gradient(135deg,#8A5A3C 33%,#D7BE9A 33% 66%,#3F7F86 66%)" data-card-color="#CFCBC6" aria-label="Brown and teal woven"></button>
        </div>
        <p class="name">Sampaguita Reversible Bucket Hat</p>
        <p class="price">₱290</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/CP1.jpg, IMAGES/CP2.jpg, IMAGES/CP3.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#dbbd4e" data-card-color="#EDE6D6" aria-label="Black"></button>
        </div>
        <p class="name">Habing-Yaman Woven Crossbody Pouch</p>
        <p class="price">₱350</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/SG1.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#e7af35" data-card-color="#E8B896" aria-label="Black"></button>
        </div>
        <p class="name">Kawayan Frame Polarized Sunglasses</p>
        <p class="price">₱490</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/HESS1.jpg, IMAGES/HESS2.jpg, IMAGES/HESS3.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#6E3B43" data-card-color="#EFEAE4" aria-label="Plum"></button>
          <button class="color" type="button" style="background:#CDB89B" data-card-color="#EFEAE4" aria-label="Tan"></button>
          <button class="color" type="button" style="background:#B8B5AB" data-card-color="#EFEAE4" aria-label="Stone gray"></button>
        </div>
        <p class="name">Hiraya Embroidered Scrunchie Set</p>
        <p class="price">₱150</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/PC1.jpg, IMAGES/PC2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#FFFFFF" data-card-color="#EDE6D6" aria-label="White"></button>
        </div>
        <p class="name">Likha Beaded Pearl Choker</p>
        <p class="price">₱250</p>
      </div>
    </div>

  </div>

  <script src="accessories.js"></script>
</body>
</html>
