<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí Products</title>
  <link rel="stylesheet" href="menBottom.css">
</head>
<body>

  <div class="products">

    <div class="card" data-photos="IMAGES/GTLSG.jpg, IMAGES/GTLSB.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#032c09" data-card-color="#E8B896"></button>
          <button class="color" style="background:#000000" data-card-color="#EDE6D6"></button>
        </div>
        <p class="name">Giting Tailored Linen Shorts</p>
        <p class="price">₱490</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/BRFC1.jpg, IMAGES/BRFC2.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#030729" data-card-color="#E8B896"></button>
        </div>
        <p class="name">Balangay Relaxed Fit Chinos</p>
        <p class="price">₱690</p>
        </div>
      </div>

    <div class="card" data-photos="IMAGES/HLT.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#dae0a2" data-card-color="#EDE6D6"></button>
        </div>
        <p class="name">Haraya Linen Trousers</p>
        <p class="price">₱790</p>
      </div>
    </div>

  </div>

  <script src="menBottom.js"></script>
</body>
</html>
