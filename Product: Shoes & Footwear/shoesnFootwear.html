<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí Products</title>
  <link rel="stylesheet" href="shoesnFootwear.css">
</head>
<body>

  <div class="products">

    <div class="card" data-photos="IMAGES/ABSP1.jpg, IMAGES/ABSP2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#d4b772" data-card-color="#EDE6D6" aria-label="Cream"></button>
          <button class="color" type="button" style="background:#850505" data-card-color="#EDE6D6" aria-label="Cream"></button>
        </div>
        <p class="name">Abaca Sole Platform Mules (Women)</p>
        <p class="price">₱590</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/LCSS1.jpg, IMAGES/LCSS2.jpg, IMAGES/LCSS3.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#E6DFD0" data-card-color="#D9D3C9" aria-label="Off-white with black sole"></button>
          <button class="color" type="button" style="background:#6B7048" data-card-color="#CDBFA6" aria-label="Olive with gum sole"></button>
          <button class="color" type="button" style="background:#F4EFE4" data-card-color="#D8C3A0" aria-label="Cream with gum sole"></button>
        </div>
        <p class="name">Lakbay Canvas Street Sneakers (Unisex)</p>
        <p class="price">₱890</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/MWC1.jpg, IMAGES/MWC2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:linear-gradient(135deg,#5E1F2E 60%,#D98C8C 60%)" data-card-color="#E9E5E2" aria-label="Burgundy velvet with floral platform"></button>
          <button class="color" type="button" style="background:linear-gradient(135deg,#2A3350 60%,#D9742B 60%)" data-card-color="#E3D9CC" aria-label="Navy with floral platform"></button>
        </div>
        <p class="name">Bakya 2.0 Modern Wooden Clogs (Women)</p>
        <p class="price">₱750</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/PSE1.jpg, IMAGES/PSE2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#f1d8a0" data-card-color="#E8B896" aria-label="Black"></button>
        </div>
        <p class="name">Paseo Slip-on Espadrilles (Men)</p>
        <p class="price">₱690</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/TES1.jpg, IMAGES/TES2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:linear-gradient(135deg,#8A7358 50%,#5A2F2A 50%)" data-card-color="#E9E3DC" aria-label="Taupe with brown footbed"></button>
          <button class="color" type="button" style="background:linear-gradient(135deg,#2F4A32 50%,#1C1C1C 50%)" data-card-color="#E6E7E8" aria-label="Forest green with black sole"></button>
        </div>
        <p class="name">Tsinelas De Goma Eco-Slides (Unisex)</p>
        <p class="price">₱390</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/LBSS1.jpg, IMAGES/LBSS2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#2b79c2" data-card-color="#EDE6D6" aria-label="White"></button>
        </div>
        <p class="name">​Liwayway Baby Soft-Sole Shoes (Kids)</p>
        <p class="price">₱250</p>
      </div>
    </div>

  </div>

  <script src="shoesnFootwear.js"></script>
</body>
</html>
