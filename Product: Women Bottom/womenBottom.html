<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí Products</title>
  <link rel="stylesheet" href="womenBottom.css">
</head>
<body>

  <div class="products">

    <div class="card" data-photos="IMAGES/YTHWTBLACK.jpg, IMAGES/YTHWTWHITE.jpg, IMAGES/YTHWTBROWN.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#000000" data-card-color="#E8B896"></button>
          <button class="color" style="background:#FFFFFF" data-card-color="#EDE6D6"></button>
          <button class="color" style="background:#c07506" data-card-color="#EDE6D6"></button>
        </div>
        <p class="name">​Yakan-Trim High-Waisted Trousers</p>
        <p class="price">₱790</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/HTMS1.jpg, IMAGES/HTMS2.jpg, IMAGES/HTMS3.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:linear-gradient(135deg,#E07A3F 33%,#6B8E4E 33% 66%,#B5382F 66%)" data-card-color="#EBD9C4" aria-label="Sunset patchwork"></button>
          <button class="color" style="background:linear-gradient(135deg,#BFE3D0 33%,#C9B8E3 33% 66%,#F4EBDD 66%)" data-card-color="#E4E0EC" aria-label="Pastel tiered"></button>
          <button class="color" style="background:linear-gradient(135deg,#7A2B3A 33%,#4B3A7A 33% 66%,#2F6B6B 66%)" data-card-color="#D5CBD3" aria-label="Midnight patchwork"></button>
        </div>
        <p class="name">Harana Tiered Maxi Skirt</p>
        <p class="price">₱690</p>
        </div>
      </div>

    <div class="card" data-photos="IMAGES/BUCP1.jpg, IMAGES/BUCP2.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#1c0a6d" data-card-color="#EDE6D6"></button>
          <button class="color" style="background:#1b42ac" data-card-color="#C9BFB0"></button>
        </div>
        <p class="name">​Bayanihan Upcycled Cargo Pants</p>
        <p class="price">₱750</p>
      </div>
    </div>

  </div>

  <script src="womenBottom.js"></script>
</body>
</html>
