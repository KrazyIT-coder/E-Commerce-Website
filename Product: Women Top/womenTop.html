<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí Products</title>
  <link rel="stylesheet" href="womenTop.css">
</head>
<body>

  <div class="products">

    <div class="card" data-photos="IMAGES/InabelTopBrown.jpg, IMAGES/InabelTopWhite.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#6B4226" data-card-color="#E8B896"></button>
          <button class="color" style="background:#FFFFFF" data-card-color="#EDE6D6"></button>
        </div>
        <p class="name">Inabel Top</p>
        <p class="price">₱690</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/KLCSLightBlue.jpg, IMAGES/KLCSWB.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#ADD8E6" data-card-color="#BCC3E0"></button>
          <button class="color" style="background:linear-gradient(135deg,#FFFFFF 50%,#111111 50%)" data-card-color="#D9D4CA"></button>
        </div>
        <p class="name">Kawayan Linen Crop Shirt</p>
        <p class="price">₱550</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/ADHTWHITE.jpg, IMAGES/ADHTBLACK.jpg">
      <div class="photo"></div>

      <button class="arrow left">&#10094;</button>
      <button class="arrow right">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" style="background:#FFFFFF" data-card-color="#EDE6D6"></button>
          <button class="color" style="background:#111111" data-card-color="#C9BFB0"></button>
        </div>
        <p class="name">Alon Draped Halter Top</p>
        <p class="price">₱490</p>
      </div>
    </div>

  </div>

  <script src="womenTop.js"></script>
</body>
</html>
