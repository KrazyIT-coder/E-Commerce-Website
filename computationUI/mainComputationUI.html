<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí – Order Summary</title>


  <!-- Design -->
  <link rel="stylesheet" href="computationUI.css">
</head>
<style>
    /* Kathabí checkout design */

/* ----- 1. COLORS ----- */
:root {
  --paper:  #f8f0e5;   /* the card background (brownish white) */
  --field:  #fffdf8;   /* inside boxes, dropdowns, buttons */
  --hover:  #efe2cf;   /* light highlight when hovering or selected */
  --ink:    #2c2523;   /* main text */
  --muted:  #8a8f73;   /* small gray-green labels */
  --olive:  #4b5136;   /* subtitle text */
  --brown:  #6b4426;   /* buttons and borders */
  --rust:   #8c4320;   /* title, total, accents */
  --line:   #cbb9a3;   /* dashed lines and borders */
}




/* ----- 2. THE PAGE ----- */
* {
  box-sizing: border-box;
}


body {
  margin: 0;
  padding: 28px 16px;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--ink);
  line-height: 1.45;


  /* Same background as the receipt */
  background-color: #ffdab9;
  background-image:
    linear-gradient(to bottom, rgba(255, 228, 181, 0.7), rgba(255, 218, 185, 1)),
    url(rizalpark.jpeg);
  background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;
}




/* ----- 3. THE CARD ----- */
.slip {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  padding: 30px 28px 26px;
  background: var(--paper);
  box-shadow: 5px 3px 6px rgba(75, 81, 54, 0.5);
}


/* Scalloped top edge */
.slip::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -8px;
  height: 8px;
  background: radial-gradient(circle at 6px 8px, transparent 5px, var(--paper) 5.5px) 0 0 / 12px 8px repeat-x;
}


h2 {
  margin: 0 0 2px;
  text-align: center;
  font-size: 1.25rem;
  letter-spacing: 0.06em;
  color: var(--rust);
}


.tagline {
  margin: 0 0 14px;
  text-align: center;
  font-size: 0.78rem;
  color: var(--olive);
}


/* Dividers */
hr {
  margin: 14px 0;
  border: 0;
  border-top: 2px dashed var(--line);
}


hr.thin {
  margin: 8px 0;
}


.label {
  margin: 0 0 6px;
  font-size: 0.8rem;
  color: var(--muted);
}




/* ----- 4. CART ITEMS ----- */
.item {
  display: grid;
  grid-template-columns: 1fr auto;   /* name on the left, price on the right */
  gap: 2px 12px;
  padding: 9px 0;
}


.item-name {
  font-size: 0.95rem;
}


.item-price {
  text-align: right;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}


.small {
  font-size: 0.76rem;
  color: var(--muted);
}


.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 4px;
}


.empty-cart {
  padding: 14px 0;
  font-size: 0.9rem;
  color: var(--muted);
}


/* Quantity box */
.stepper {
  display: inline-flex;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 4px;
}


.stepper button {
  width: 28px;
  height: 28px;
  border: 0;
  background: var(--field);
  color: var(--ink);
  font: inherit;
  font-size: 1.05rem;
  cursor: pointer;
}


.stepper button:hover {
  background: var(--hover);
}


.stepper output {
  min-width: 30px;
  line-height: 28px;
  text-align: center;
  font-size: 0.9rem;
  background: var(--field);
  color: var(--ink);
}


/* Remove link */
.remove {
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  font-size: 0.76rem;
  color: var(--rust);
  text-decoration: underline;
  cursor: pointer;
}




/* ----- 5. DROPDOWNS ----- */
select {
  padding: 4px 6px;
  font: inherit;
  font-size: 0.85rem;
  background: var(--field);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 4px;
}




/* ----- 6. ADD A PRODUCT ----- */
.add-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}


.add-row select {
  flex: 1;
  min-width: 120px;
}


.message {
  min-height: 1.1em;
  margin: 5px 0 0;
  font-size: 0.78rem;
  color: var(--rust);
}




/* ----- 7. COLOR CIRCLES ----- */
.swatch {
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
}


.swatch.small-swatch {
  width: 18px;
  height: 18px;
}


/* Selected color */
.swatch.selected {
  outline: 2px solid var(--rust);
  outline-offset: 2px;
}


.swatch-group {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}


#colorPicker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
}




/* ----- 8. DELIVERY OPTIONS ----- */
.option {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 5px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 0.9rem;
  cursor: pointer;
}


.option input {
  margin-right: 8px;
  accent-color: var(--rust);
}


.option .small {
  margin-left: 4px;
}


/* Selected option */
.option:has(input:checked) {
  border-color: var(--rust);
  background: var(--hover);
}




/* ----- 9. TOTALS ----- */
.row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}


.row.total {
  padding-top: 8px;
  font-size: 1.35rem;
  font-weight: bold;
  color: var(--rust);
}




/* ----- 10. BUTTONS ----- */
.btn {
  padding: 4px 14px;
  font: inherit;
  font-size: 0.85rem;
  background: transparent;
  color: var(--brown);
  border: 1px solid var(--brown);
  border-radius: 4px;
  cursor: pointer;
}


.btn:hover {
  background: var(--hover);
}


/* Pay now link */
.pay-button {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  font-size: 1rem;
  text-align: center;
  text-decoration: none;
  background: var(--brown);
  color: var(--paper);
  border-radius: 6px;
}


.pay-button:hover {
  background: var(--rust);
}


/* Disabled Pay now */
.pay-button[aria-disabled="true"] {
  opacity: 0.45;
  pointer-events: none;
}




/* ----- 11. KEYBOARD FOCUS ----- */
:focus-visible {
  outline: 3px solid var(--rust);
  outline-offset: 2px;
}


/* ----- VOUCHER STYLES ----- */

.voucher-section {
  margin: 16px 0;
  padding: 14px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.voucher-section h3 {
  margin: 0 0 12px;
  color: var(--rust);
  font-size: 1.05rem;
}

.voucher-code-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.voucher-code-row input {
  flex: 1;
  min-width: 0;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--field);
  color: var(--ink);
  font: inherit;
  font-size: 0.85rem;
}

.voucher-section > .label {
  margin-top: 14px;
}

.voucher-card {
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  margin: 9px 0;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--field);
  cursor: pointer;
}

.voucher-card:has(input:checked) {
  border-color: var(--rust);
  background: var(--hover);
}

.voucher-card input[type="checkbox"] {
  flex-shrink: 0;
  width: 19px;
  height: 19px;
  margin-left: auto;
  accent-color: var(--rust);
  cursor: pointer;
}

.voucher-art strong {
  font-size: 1.6rem;
  line-height: 1.2;
}

.voucher-info {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  gap: 4px;
  font-size: 0.82rem;
}

.voucher-info strong {
  color: var(--ink);
  font-size: 0.94rem;
}

.voucher-info span {
  overflow-wrap: anywhere;
}

.voucher-condition {
  color: var(--muted);
  font-size: 0.73rem;
}

.voucher-summary {
  margin: 12px 0 0;
  padding: 10px;
  background: var(--hover);
  border-radius: 4px;
  color: var(--olive);
  font-size: 0.82rem;
  overflow-wrap: anywhere;
}

.voucher-discount-text {
  color: var(--rust);
}

.voucher-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 9px 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--field);
  cursor: pointer;
}

.voucher-card:has(input:checked) {
  border-color: var(--rust);
  background: var(--hover);
}

.voucher-info {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  font-size: 0.85rem;
}

.voucher-info strong {
  color: var(--ink);
  font-size: 1rem;
}

.voucher-info span {
  color: var(--muted);
  font-size: 0.8rem;
}

.voucher-card input[type="checkbox"] {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  accent-color: var(--rust);
  cursor: pointer;
}

</style>
<body>
  <main class="slip">


    <!-- Title -->
    <h2>ORDER SUMMARY</h2>
    <p class="tagline">Review the amounts before you pay</p>
    <hr>


    <!-- Cart items -->
    <div id="items"></div>


    <!-- Add a product -->
    <p class="label" style="margin-top: 8px;">Add a product</p>
    <div class="add-row">
      <select id="productSelect" aria-label="Product"></select>
      <select id="sizeSelect" aria-label="Size"></select>
      <button class="btn" id="addButton" type="button">Add</button>
    </div>
    <div id="colorPicker"></div>
    <p class="message" id="addMessage" role="status"></p>
    <hr>


    <!-- Delivery -->
    <p class="label">Delivery</p>
    <div id="shippingBox"></div>


    <!-- Payment method -->
    <p class="label" style="margin-top: 12px;">Payment</p>
    <select id="paymentSelect" aria-label="Payment method" style="width: 100%;">
      <option>GCash</option>
      <option>Maya</option>
      <option>Credit / debit card</option>
      <option>Cash on delivery</option>
    </select>
    <hr>

    
<!-- KATHABI VOUCHERS -->
<section id="kathabiVouchers" class="voucher-section">
  <h3>Vouchers and Discounts</h3>

  <div class="voucher-code-row">
    <input
      type="text"
      id="platformVoucherCode"
      placeholder="Enter platform voucher code"
      aria-label="Platform voucher code"
    >
    <button type="button" class="btn" id="applyPlatformVoucher">
      Apply
    </button>
  </div>

  <p id="voucherCodeMessage" class="message" role="status"></p>

  <p class="label">Shipping Voucher</p>

  <label class="voucher-card" for="freeShippingVoucher">
    <span class="voucher-info">
      <strong>Free Shipping</strong>
      <span>Minimum spend ₱999</span>
    </span>
    <input type="checkbox" id="freeShippingVoucher">
  </label>

  <p class="label">Discount / Cashback</p>

  <label class="voucher-card" for="discount10Voucher">
    <span class="voucher-info">
      <strong>10% off</strong>
      <span>Minimum spend ₱1,999</span>
    </span>
    <input type="checkbox" id="discount10Voucher">
  </label>

  <label class="voucher-card" for="discount15Voucher">
    <span class="voucher-info">
      <strong>15% off</strong>
      <span>Minimum spend ₱3,499</span>
    </span>
    <input type="checkbox" id="discount15Voucher">
  </label>

  <label class="voucher-card" for="discount20Voucher">
    <span class="voucher-info">
      <strong>20% off</strong>
      <span>Minimum spend ₱4,999</span>
    </span>
    <input type="checkbox" id="discount20Voucher">
  </label>

  <p id="voucherMessage" class="message" role="status"></p>

  <p id="voucherSummary" class="voucher-summary">
    No vouchers selected.
  </p>
</section>

    <!-- Totals -->
    <div class="row"><span>Subtotal</span>           <span id="subtotalText"></span></div>
    <div class="row"><span>Shipping</span>           <span id="shippingText"></span></div>
    <div class="row"><span>Included VAT (12%)</span> <span id="vatText"></span></div>
    <hr class="thin">
    <div class="row total"><span>Total to pay</span> <span id="totalText"></span></div>


    <!-- Link to the receipt (change the href if file name is different) -->
    <a class="btn pay-button" id="payButton" href="displayReceipt.html">Pay now</a>

  </main>
  <script>
    // Kathabí checkout: the math and the buttons


// ----- Settings -----
var VAT_RATE = 0.12;


var shippingOptions = [
  { id: "standard", label: "Standard",     note: "3 to 5 days",    fee: 100 },
  { id: "express",  label: "Express",      note: "1 to 2 days",    fee: 250 },
  { id: "pickup",   label: "Store pickup", note: "Ready tomorrow", fee: 0 }
];


// ----- Products (copy a line to add a product) -----
var ADULT = ["S", "M", "L", "XL"];
var KIDS  = ["S", "M", "L", "XL"];
var BABY  = ["S", "M", "L", "XL"];
var ONE   = ["One size"];


var products = [
  { name: "Inabel Top", price: 690, sizes: ADULT, colors: ["#6B4226", "#FFFFFF"] },
  { name: "Kawayan Linen Crop Shirt", price: 550, sizes: ADULT, colors: ["#ADD8E6", "linear-gradient(135deg,#FFFFFF 50%,#111111 50%)"] },
  { name: "Alon Draped Halter Top", price: 490, sizes: ADULT, colors: ["#FFFFFF", "#111111"] },
  { name: "Yakan-Trim High-Waisted Trousers", price: 790, sizes: ADULT, colors: ["#000000", "#FFFFFF", "#c07506"] },
  { name: "Harana Tiered Maxi Skirt", price: 690, sizes: ADULT, colors: [
      "linear-gradient(135deg,#E07A3F 33%,#6B8E4E 33% 66%,#B5382F 66%)",
      "linear-gradient(135deg,#BFE3D0 33%,#C9B8E3 33% 66%,#F4EBDD 66%)",
      "linear-gradient(135deg,#7A2B3A 33%,#4B3A7A 33% 66%,#2F6B6B 66%)" ] },
  { name: "Bayanihan Upcycled Cargo Pants", price: 750, sizes: ADULT, colors: ["#1c0a6d", "#1b42ac"] },
  { name: "Modern Barong Street Polo", price: 790, sizes: ADULT, colors: ["#E8B896", "#EDE6D6"] },
  { name: "Kayumanggi Everyday Henley", price: 450, sizes: ADULT, colors: ["#f5f5f4", "#332504"] },
  { name: "Kadena Upcycled Graphic Tee", price: 390, sizes: ADULT, colors: ["#dbdbdb", "#dfb690", "#060608"] },
  { name: "Katipunan Upcycled Denim Shacket", price: 990, sizes: ADULT, colors: [
      "linear-gradient(135deg,#2F4A6B 33%,#5B7FA6 33% 66%,#9DB8D4 66%)",
      "linear-gradient(135deg,#C4513A 25%,#E3B23C 25% 50%,#3F7F86 50% 75%,#F1E6D3 75%)" ] },
  { name: "Giting Tailored Linen Shorts", price: 490, sizes: ADULT, colors: ["#032c09", "#000000"] },
  { name: "Balangay Relaxed Fit Chinos", price: 690, sizes: ADULT, colors: ["#030729"] },
  { name: "Haraya Linen Trousers", price: 790, sizes: ADULT, colors: ["#dae0a2"] },
  { name: "Bulilit Inabel Smocked Dress (Girls)", price: 450, sizes: KIDS, colors: ["#EDE6D6"] },
  { name: "Lahi Mini Barong Shirt (Boys)", price: 390, sizes: KIDS, colors: ["#F3EEE3", "#1F2A44"] },
  { name: "Laro Unisex Drawstring Shorts", price: 250, sizes: ADULT, colors: ["#1C1C1C", "#3d0409"] },
  { name: "Sinag Romper (Infants/Toddlers)", price: 290, sizes: BABY, colors: [
      "#6B7F4A", "#E8B92E", "linear-gradient(135deg,#C9343F 50%,#F6E9EA 50%)" ] },
  { name: "Solihiya Structured Tote Bag", price: 790, sizes: ONE, colors: ["#d4b772"] },
  { name: "Sampaguita Reversible Bucket Hat", price: 290, sizes: ONE, colors: [
      "linear-gradient(135deg,#C9A57A 33%,#5A3E2B 33% 66%,#2F3E66 66%)",
      "linear-gradient(135deg,#8A5A3C 33%,#D7BE9A 33% 66%,#3F7F86 66%)" ] },
  { name: "Habing-Yaman Woven Crossbody Pouch", price: 350, sizes: ONE, colors: ["#dbbd4e"] },
  { name: "Kawayan Frame Polarized Sunglasses", price: 490, sizes: ONE, colors: ["#e7af35"] },
  { name: "Hiraya Embroidered Scrunchie Set", price: 150, sizes: ONE, colors: ["#6E3B43", "#CDB89B", "#B8B5AB"] },
  { name: "Likha Beaded Pearl Choker", price: 250, sizes: ONE, colors: ["#FFFFFF"] }
];


// ----- What the customer has chosen -----
var cart = [];
var shippingId = "standard";
var pickedColor = 0;


// ----- Small helpers -----
function getEl(id) {
  return document.getElementById(id);
}


// 1300 becomes Php 1,300.00
function peso(amount) {
  return "Php " + amount.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}


function getShipping() {
  for (var i = 0; i < shippingOptions.length; i++) {
    if (shippingOptions[i].id === shippingId) {
      return shippingOptions[i];
    }
  }
}


// One color circle
function swatch(color, isSelected, onclick, extraClass) {
  var html = '<button type="button" class="swatch ' + extraClass + (isSelected ? " selected" : "") + '"';
  html += ' style="background:' + color + '" ' + onclick + '></button>';
  return html;
}


// ----- The math -----
// Total = subtotal + shipping
// VAT = total / 1.12 x 0.12 (already inside the price)
function getTotals() {
  var subtotal = 0;
  for (var i = 0; i < cart.length; i++) {
    subtotal = subtotal + cart[i].price * cart[i].qty;
  }


  var shipping = 0;
  if (cart.length > 0) {
    shipping = getShipping().fee;
  }


  var total = subtotal + shipping;
  var vat = total / (1 + VAT_RATE) * VAT_RATE;


  return { subtotal: subtotal, shipping: shipping, vat: vat, total: total };
}


// ----- Show things on the page -----
function showCart() {
  var html = "";


  if (cart.length === 0) {
    html = '<p class="empty-cart">Your cart is empty. Add a product below.</p>';
  }


  for (var i = 0; i < cart.length; i++) {
    var item = cart[i];
    var sizeText = (item.size === "One size") ? "One size" : "Size " + item.size;


    html += '<div class="item">';
    html += '<div class="item-name">' + item.name + '</div>';
    html += '<div class="item-price">' + peso(item.price * item.qty) + '</div>';
    html += '<div>';
    html += '<div class="small">' + sizeText + ' &times; ' + peso(item.price) + '</div>';
    html += '<div class="controls">';
    html += '<span class="stepper">';
    html += '<button type="button" onclick="changeQty(' + i + ', -1)">&minus;</button>';
    html += '<output>' + item.qty + '</output>';
    html += '<button type="button" onclick="changeQty(' + i + ', 1)">+</button>';
    html += '</span>';
    html += swatch(item.color, false, "", "small-swatch");
    html += '<button class="remove" type="button" onclick="removeItem(' + i + ')">Remove</button>';
    html += '</div></div></div>';
  }


  getEl("items").innerHTML = html;
}


function showShipping() {
  var html = "";


  for (var i = 0; i < shippingOptions.length; i++) {
    var option = shippingOptions[i];
    var checked = (option.id === shippingId) ? " checked" : "";
    var fee = (option.fee > 0) ? peso(option.fee) : "Free";


    html += '<label class="option"><span>';
    html += '<input type="radio" name="shipping"' + checked + ' onclick="chooseShipping(\'' + option.id + '\')">';
    html += option.label + '<span class="small">' + option.note + '</span>';
    html += '</span><span>' + fee + '</span></label>';
  }


  getEl("shippingBox").innerHTML = html;
}


function showTotals() {
  var t = getTotals();


  getEl("subtotalText").textContent = peso(t.subtotal);
  getEl("shippingText").textContent = (t.shipping > 0) ? peso(t.shipping) : "Free";
  getEl("vatText").textContent = peso(t.vat);
  getEl("totalText").textContent = peso(t.total);


  // Disable Pay now if the cart is empty
  getEl("payButton").setAttribute("aria-disabled", cart.length === 0);
}


function refresh() {
  showCart();
  showTotals();
}


// ----- Add a product area -----
function showProducts() {
  var html = "";
  for (var i = 0; i < products.length; i++) {
    html += '<option value="' + i + '">' + products[i].name + ' - ' + peso(products[i].price) + '</option>';
  }
  getEl("productSelect").innerHTML = html;
  showSizesAndColors();
}


function showSizesAndColors() {
  var product = products[getEl("productSelect").value];


  var sizeHtml = "";
  for (var i = 0; i < product.sizes.length; i++) {
    sizeHtml += "<option>" + product.sizes[i] + "</option>";
  }
  getEl("sizeSelect").innerHTML = sizeHtml;


  pickedColor = 0;
  showColors();
}


function showColors() {
  var product = products[getEl("productSelect").value];


  var html = '<span class="small">Color</span> ';
  for (var i = 0; i < product.colors.length; i++) {
    html += swatch(product.colors[i], i === pickedColor, 'onclick="pickColor(' + i + ')"', "");
  }
  getEl("colorPicker").innerHTML = html;
}


// ----- Buttons -----
function pickColor(index) {
  pickedColor = index;
  showColors();
}


function chooseShipping(id) {
  shippingId = id;
  showShipping();
  showTotals();
}


function changeQty(index, amount) {
  cart[index].qty = cart[index].qty + amount;
  if (cart[index].qty < 1) {
    cart[index].qty = 1;
  }
  refresh();
}


function removeItem(index) {
  cart.splice(index, 1);
  refresh();
}


// Add button: same product, size and color just adds to the quantity
getEl("addButton").onclick = function () {
  var product = products[getEl("productSelect").value];
  var size = getEl("sizeSelect").value;
  var color = product.colors[pickedColor];


  var found = false;
  for (var i = 0; i < cart.length; i++) {
    if (cart[i].name === product.name && cart[i].size === size && cart[i].color === color) {
      cart[i].qty = cart[i].qty + 1;
      found = true;
    }
  }


  if (found === false) {
    cart.push({ name: product.name, price: product.price, size: size, color: color, qty: 1 });
  }


  getEl("addMessage").textContent = "Added " + product.name + " (" + size + ").";
  refresh();
};


getEl("productSelect").onchange = showSizesAndColors;


// Pay now: save the order, then the link opens the receipt page
getEl("payButton").onclick = function (event) {
  if (cart.length === 0) {
    event.preventDefault();
    return;
  }


  var order = getTotals();
  order.items = cart;
  order.shippingMethod = getShipping().label;
  order.payment = getEl("paymentSelect").value;
  sessionStorage.setItem("kathabiOrder", JSON.stringify(order));
};


// ----- Start the page -----
showProducts();

<script>
/* ----- KATHABI VOUCHER LOGIC ----- */

(function () {
  // Keep references to the original functions.
  var originalGetTotals = getTotals;
  var originalShowTotals = showTotals;

  var voucherIds = [
    "freeShippingVoucher",
    "discount10Voucher",
    "discount15Voucher",
    "discount20Voucher"
  ];

  var selectedDiscount = 0;
  var shippingVoucherSelected = false;

  function voucherElement(id) {
    return document.getElementById(id);
  }

  function cartSubtotal() {
    var subtotal = 0;

    for (var i = 0; i < cart.length; i++) {
      subtotal += cart[i].price * cart[i].qty;
    }

    return subtotal;
  }

  function getEligibleDiscountRate(subtotal) {
    if (selectedDiscount === 20 && subtotal >= 4999) {
      return 0.20;
    }

    if (selectedDiscount === 15 && subtotal >= 3499) {
      return 0.15;
    }

    if (selectedDiscount === 10 && subtotal >= 1999) {
      return 0.10;
    }

    return 0;
  }

  function getVoucherTotals() {
    var base = originalGetTotals();
    var subtotal = base.subtotal;
    var rate = getEligibleDiscountRate(subtotal);

    // Percentage discounts apply to the merchandise subtotal.
    var productDiscount = Math.round(subtotal * rate * 100) / 100;

    // Free shipping requires a merchandise subtotal of at least ₱999.
    var shippingDiscount = (
      shippingVoucherSelected &&
      subtotal >= 999 &&
      cart.length > 0
    ) ? base.shipping : 0;

    var finalShipping = base.shipping - shippingDiscount;
    var totalDiscount = productDiscount + shippingDiscount;
    var total = Math.max(
      0,
      subtotal + finalShipping - productDiscount
    );

    // VAT is treated as already included in the discounted total.
    var vat = total / (1 + VAT_RATE) * VAT_RATE;

    return {
      subtotal: subtotal,
      shipping: finalShipping,
      originalShipping: base.shipping,
      shippingDiscount: shippingDiscount,
      productDiscount: productDiscount,
      discount: totalDiscount,
      discountRate: rate,
      vat: vat,
      total: total
    };
  }

  // Integrate discounts into the original checkout calculations.
  getTotals = function () {
    return getVoucherTotals();
  };

  // Add a discount row to the existing totals area.
  var totalsArea = voucherElement("subtotalText").parentElement.parentElement;
  var shippingRow = voucherElement("shippingText").parentElement;

  var discountRow = document.createElement("div");
  discountRow.className = "row voucher-discount-text";
  discountRow.innerHTML =
    '<span>Voucher discount</span>' +
    '<span id="voucherDiscountText">- Php 0.00</span>';

  shippingRow.insertAdjacentElement("afterend", discountRow);

  // Refresh the original totals first, then update the voucher display.
  showTotals = function () {
    originalShowTotals();

    var t = getVoucherTotals();

    voucherElement("subtotalText").textContent = peso(t.subtotal);

    voucherElement("shippingText").textContent =
      t.shipping > 0 ? peso(t.shipping) : "Free";

    voucherElement("vatText").textContent = peso(t.vat);
    voucherElement("totalText").textContent = peso(t.total);

    voucherElement("voucherDiscountText").textContent =
      "- " + peso(t.discount);

    var messages = [];

    if (shippingVoucherSelected) {
      if (t.subtotal >= 999 && cart.length > 0) {
        messages.push("Free shipping applied");
      } else {
        messages.push("Free shipping requires ₱999 merchandise spend");
      }
    }

    if (selectedDiscount > 0) {
      var requiredSpend = {
        10: 1999,
        15: 3499,
        20: 4999
      }[selectedDiscount];

      if (t.discountRate > 0) {
        messages.push(selectedDiscount + "% discount applied");
      } else {
        messages.push(
          selectedDiscount + "% discount requires ₱" +
          requiredSpend.toLocaleString("en-PH") + " merchandise spend"
        );
      }
    }

    voucherElement("voucherSummary").textContent =
      messages.length ? messages.join(" • ") : "No vouchers selected.";
  };

  function updateVouchers(changedId) {
    var checkbox = voucherElement(changedId);

    if (changedId === "freeShippingVoucher") {
      shippingVoucherSelected = checkbox.checked;
    } else if (checkbox.checked) {
      // Only one percentage voucher can be selected at a time.
      selectedDiscount = {
        discount10Voucher: 10,
        discount15Voucher: 15,
        discount20Voucher: 20
      }[changedId];

      voucherIds.slice(1).forEach(function (id) {
        if (id !== changedId) {
          voucherElement(id).checked = false;
        }
      });
    } else {
      selectedDiscount = 0;
    }

    showTotals();
  }

  voucherIds.forEach(function (id) {
    voucherElement(id).addEventListener("change", function () {
      updateVouchers(id);
    });
  });

  // Keep the platform-code field safe and explain its status.
  voucherElement("applyPlatformVoucher").addEventListener("click", function () {
    var code = voucherElement("platformVoucherCode").value.trim();

    voucherElement("voucherCodeMessage").textContent = code
      ? "This checkout has no platform voucher codes configured yet. Select one of the available vouchers below."
      : "Please enter a platform voucher code.";
  });

  // Wrap refresh so cart edits recalculate discounts immediately.
  var originalRefresh = refresh;

  refresh = function () {
    originalRefresh();
    showTotals();
  };

  // Recalculate after shipping changes.
  var originalChooseShipping = chooseShipping;

  chooseShipping = function (id) {
    originalChooseShipping(id);
    showTotals();
  };

  // Include voucher details in the saved order.
  var payButton = voucherElement("payButton");

  payButton.addEventListener("click", function () {
    if (cart.length === 0) {
      return;
    }

    var order = getTotals();

    order.items = cart;
    order.shippingMethod = getShipping().label;
    order.payment = voucherElement("paymentSelect").value;
    order.vouchers = {
      freeShipping: shippingVoucherSelected &&
        order.shippingDiscount > 0,
      percentage: order.discountRate * 100,
      productDiscount: order.productDiscount,
      shippingDiscount: order.shippingDiscount,
      totalDiscount: order.discount
    };

    sessionStorage.setItem("kathabiOrder", JSON.stringify(order));
  });

  // Initial render.
  showTotals();

})();

</script>
