<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí Products</title>
  <link rel="stylesheet" href="kidsCollection.css">
</head>
<body>

  <div class="products">

    <div class="card" data-photos="IMAGES/BISDG.jpg, IMAGES/BISDG2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#EDE6D6" data-card-color="#EDE6D6" aria-label="Cream"></button>
        </div>
        <p class="name">Bulilit Inabel Smocked Dress (Girls)</p>
        <p class="price">₱450</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/LMBS1.jpg, IMAGES/LMBS2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#F3EEE3" data-card-color="#C9D5A8" aria-label="Off-white"></button>
          <button class="color" type="button" style="background:#1F2A44" data-card-color="#D9CDBA" aria-label="Navy"></button>
        </div>
        <p class="name">Lahi Mini Barong Shirt (Boys)</p>
        <p class="price">₱390</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/LUDS1.jpg, IMAGES/LUDS2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#1C1C1C" data-card-color="#EDE6D6" aria-label="Black"></button>
          <button class="color" type="button" style="background:#3d0409" data-card-color="#C9BFB0" aria-label="Light blue"></button>
        </div>
        <p class="name">Laro Unisex Drawstring Shorts</p>
        <p class="price">₱250</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/SRG.jpg, IMAGES/SRY.jpg, IMAGES/SRP.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#6B7F4A" data-card-color="#EFE6D4" aria-label="Olive green"></button>
          <button class="color" type="button" style="background:#E8B92E" data-card-color="#D9BFA0" aria-label="Mustard yellow"></button>
          <button class="color" type="button" style="background:linear-gradient(135deg,#C9343F 50%,#F6E9EA 50%)" data-card-color="#F0DADD" aria-label="Red gingham"></button>
        </div>
        <p class="name">Sinag Romper (Infants/Toddlers)</p>
        <p class="price">₱290</p>
      </div>
    </div>

  </div>

  <script src="kidsCollection.js"></script>
</body>
</html>
