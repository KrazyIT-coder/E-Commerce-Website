<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kathabí Products</title>
  <link rel="stylesheet" href="menTop.css">
</head>
<body>

  <div class="products">

    <div class="card" data-photos="IMAGES/MBSPBW.jpg, IMAGES/MBSPWG.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#E8B896" data-card-color="#E8B896" aria-label="Peach"></button>
          <button class="color" type="button" style="background:#EDE6D6" data-card-color="#EDE6D6" aria-label="Cream"></button>
        </div>
        <p class="name">Modern Barong Street Polo</p>
        <p class="price">₱790</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/KEHW.jpg, IMAGES/KEHB.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#f5f5f4" data-card-color="#E8B896" aria-label="Peach"></button>
          <button class="color" type="button" style="background:#332504" data-card-color="#EDE6D6" aria-label="Cream"></button>
        </div>
        <p class="name">Kayumanggi Everyday Henley</p>
        <p class="price">₱450</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/KUGCW.jpg, IMAGES/KUGCW2.jpg, IMAGES/KUGCB.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:#dbdbdb" data-card-color="#EDE6D6" aria-label="Deep indigo"></button>
          <button class="color" type="button" style="background:#dfb690" data-card-color="#C9BFB0" aria-label="Royal blue"></button>
          <button class="color" type="button" style="background:#060608" data-card-color="#C9BFB0" aria-label="Royal blue"></button>
        </div>
        <p class="name">Kadena Upcycled Graphic Tee</p>
        <p class="price">₱390</p>
      </div>
    </div>

    <div class="card" data-photos="IMAGES/KUDS1.jpg, IMAGES/KUDS2.jpg">
      <div class="photo"></div>

      <button class="arrow left" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="arrow right" type="button" aria-label="Next photo">&#10095;</button>

      <div class="info">
        <div class="colors">
          <button class="color" type="button" style="background:linear-gradient(135deg,#2F4A6B 33%,#5B7FA6 33% 66%,#9DB8D4 66%)" data-card-color="#D6D9DC" aria-label="Denim patchwork"></button>
          <button class="color" type="button" style="background:linear-gradient(135deg,#C4513A 25%,#E3B23C 25% 50%,#3F7F86 50% 75%,#F1E6D3 75%)" data-card-color="#EADCC8" aria-label="Multicolor patchwork"></button>
        </div>
        <p class="name">Katipunan Upcycled Denim Shacket</p>
        <p class="price">₱990</p>
      </div>
    </div>

  </div>

  <script src="menTop.js"></script>
</body>
</html>
